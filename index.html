
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KvízAréna</title>

    <link rel="stylesheet" href="style.css">
</head><script src="questions.js"></script>

<body>

    <div class="container" id="nameScreen">

        <h1>🧠 KvízAréna</h1>

        <p>Üdvözöllek a KvízArénában!</p>

        <h2>Add meg a neved!</h2>

        <input
            type="text"
            id="playerName"
            placeholder="Írd be a neved..."
            maxlength="30"
        >

        <button onclick="startGame()">Tovább</button>

        <p id="errorMessage"></p>

    </div>


    <div class="container" id="gameModeScreen" style="display: none;">

    <h1>🎮 Játékmód</h1>

    <p id="welcomeMessage"></p>

    <h2>Válassz nehézséget!</h2>

    <button onclick="selectDifficulty('Könnyű', 30)">
        🟢 Könnyű
        <br>
        <small>30 kérdés</small>
    </button>

    <br><br>

    <button onclick="selectDifficulty('Nehéz', 60)">
        🟡 Nehéz
        <br>
        <small>60 kérdés</small>
    </button>

    <br><br>

    <button onclick="selectDifficulty('Nagyon nehéz', 90)">
        🔴 Nagyon nehéz
        <br>
        <small>90 kérdés</small>
    </button>

    <br><br>

    <button onclick="selectDifficulty('Lehetetlen', 120)">
        ☠️ Lehetetlen
        <br>
        <small>120 kérdés</small>
    </button>

</div>


<div class="container" id="categoryScreen" style="display: none;">

    <h1>📚 Kategóriák</h1>

    <p id="difficultyMessage"></p>

    <h2>Válassz kategóriát!</h2>

    <button onclick="selectCategory('Magyarország')">
        🇭🇺 Magyarország
    </button>

    <br><br>

    <button onclick="selectCategory('Történelem')">
        📜 Történelem
    </button>

    <br><br>

    <button onclick="selectCategory('Földrajz')">
        🌍 Földrajz
    </button>

    <br><br>

    <button onclick="selectCategory('Tudomány')">
        🔬 Tudomány
    </button>

    <br><br>

    <button onclick="selectCategory('Sport')">
        ⚽ Sport
    </button>

    <br><br>

    <button onclick="selectCategory('Film és sorozat')">
        🎬 Film és sorozat
    </button>

    <br><br>

    <button onclick="selectCategory('Zene')">
        🎵 Zene
    </button>

    <br><br>

    <button onclick="selectCategory('Videójátékok')">
        🎮 Videójátékok
    </button>

    <br><br>

    <button onclick="selectCategory('Irodalom')">
        📚 Irodalom
    </button>

    <br><br>

    <button onclick="selectCategory('Technológia')">
        💻 Technológia
    </button>

    <br><br>

    <button onclick="selectCategory('Általános műveltség')">
        🧠 Általános műveltség
    </button>

</div>

        <h1>🎮 Játékmód</h1>

        <p id="welcomeMessage"></p>

        <h2>Válassz nehézséget!</h2>

        <button onclick="selectDifficulty('Könnyű', 30)">
            🟢 Könnyű
            <br>
            <small>30 kérdés</small>
        </button>

        <br><br>

        <button onclick="selectDifficulty('Nehéz', 60)">
            🟡 Nehéz
            <br>
            <small>60 kérdés</small>
        </button>

        <br><br>

        <button onclick="selectDifficulty('Nagyon nehéz', 90)">
            🔴 Nagyon nehéz
            <br>
            <small>90 kérdés</small>
        </button>

        <br><br>

        <button onclick="selectDifficulty('Lehetetlen', 120)">
            ☠️ Lehetetlen
            <br>
            <small>120 kérdés</small>
        </button>

    </div>


    <script>

        let playerName = "";


        function startGame() {

            const nameInput =
                document.getElementById("playerName");

            const errorMessage =
                document.getElementById("errorMessage");

            const name =
                nameInput.value.trim();


            if (name === "") {

                errorMessage.textContent =
                    "❌ A név megadása kötelező!";

                return;
            }


            playerName = name;


            document.getElementById("nameScreen").style.display =
                "none";

            document.getElementById("gameModeScreen").style.display =
                "block";


            document.getElementById("welcomeMessage").textContent =
                "Szia, " + playerName + "! Válaszd ki a játékmódot.";
        }


       let selectedDifficulty = "";
let selectedQuestionCount = "";
let selectedCategory = "";


function selectDifficulty(difficulty, questionCount) {

    selectedDifficulty = difficulty;
    selectedQuestionCount = questionCount;

    document.getElementById("gameModeScreen").style.display =
        "none";

    document.getElementById("categoryScreen").style.display =
        "block";

    document.getElementById("difficultyMessage").textContent =
        difficulty + " mód – " +
        questionCount + " kérdés";
}


function selectCategory(category) {

    selectedCategory = category;

    alert(
        "Kategória: " + selectedCategory +
        "\nNehézség: " + selectedDifficulty +
        "\nKérdések: " + selectedQuestionCount
    );

}

    </script>

</body>
</html>
